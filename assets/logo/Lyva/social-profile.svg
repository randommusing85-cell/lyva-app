<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&display=swap');
    </style>
  </defs>
  <!-- Background -->
  <rect width="400" height="400" fill="#4A1528"/>
  <!-- Outer ring -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="#72243E" stroke-width="3"/>
  <!-- Mid ring -->
  <circle cx="200" cy="200" r="125" fill="none" stroke="#8B2252" stroke-width="2"/>
  <!-- Filled centre -->
  <circle cx="200" cy="200" r="90" fill="#C4608A"/>
  <!-- Monogram -->
  <text x="200" y="226" font-family="'Cormorant Garamond', Georgia, serif" font-size="90" font-weight="500" fill="#FBEAF0" text-anchor="middle">ly</text>
  <!-- Triple bud -->
  <circle cx="200" cy="40" r="18" fill="#F4C0D1"/>
  <circle cx="168" cy="51" r="13" fill="#ED93B1" opacity="0.8"/>
  <circle cx="232" cy="51" r="13" fill="#ED93B1" opacity="0.8"/>
</svg>
