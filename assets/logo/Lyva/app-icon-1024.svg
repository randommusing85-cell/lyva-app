<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&display=swap');
    </style>
  </defs>
  <!-- Background -->
  <rect width="1024" height="1024" rx="224" fill="#4A1528"/>
  <!-- Outer ring -->
  <circle cx="512" cy="512" r="340" fill="none" stroke="#72243E" stroke-width="8"/>
  <!-- Mid ring -->
  <circle cx="512" cy="512" r="264" fill="none" stroke="#8B2252" stroke-width="5"/>
  <!-- Filled centre -->
  <circle cx="512" cy="512" r="190" fill="#C4608A"/>
  <!-- Monogram -->
  <text x="512" y="572" font-family="'Cormorant Garamond', Georgia, serif" font-size="190" font-weight="500" fill="#FBEAF0" text-anchor="middle">ly</text>
  <!-- Triple bud — centre top -->
  <circle cx="512" cy="172" r="40" fill="#F4C0D1"/>
  <circle cx="424" cy="198" r="28" fill="#ED93B1" opacity="0.8"/>
  <circle cx="600" cy="198" r="28" fill="#ED93B1" opacity="0.8"/>
