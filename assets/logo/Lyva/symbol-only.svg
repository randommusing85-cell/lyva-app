<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&display=swap');
    </style>
  </defs>
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#F4C0D1" stroke-width="2"/>
  <!-- Mid ring -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="#ED93B1" stroke-width="1.5"/>
  <!-- Filled centre -->
  <circle cx="100" cy="100" r="50" fill="#8B2252"/>
  <!-- Monogram -->
  <text x="100" y="118" font-family="'Cormorant Garamond', Georgia, serif" font-size="50" font-weight="500" fill="#FBEAF0" text-anchor="middle">ly</text>
  <!-- Triple bud -->
  <circle cx="100" cy="10" r="10" fill="#8B2252"/>
  <circle cx="74" cy="17" r="7" fill="#C4608A" opacity="0.7"/>
  <circle cx="126" cy="17" r="7" fill="#C4608A" opacity="0.7"/>
</svg>
