<svg xmlns="http://www.w3.org/2000/svg" width="600" height="120" viewBox="0 0 600 120">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400&display=swap');
    </style>
  </defs>
  <!-- Symbol -->
  <circle cx="60" cy="60" r="50" fill="none" stroke="#F4C0D1" stroke-width="1.2"/>
  <circle cx="60" cy="60" r="39" fill="none" stroke="#ED93B1" stroke-width="0.8"/>
  <circle cx="60" cy="60" r="28" fill="#8B2252"/>
  <text x="60" y="69" font-family="'Cormorant Garamond', Georgia, serif" font-size="28" font-weight="500" fill="#FBEAF0" text-anchor="middle">ly</text>
  <!-- Triple bud -->
  <circle cx="60" cy="10" r="5.5" fill="#8B2252"/>
  <circle cx="47" cy="13.5" r="4" fill="#C4608A" opacity="0.7"/>
  <circle cx="73" cy="13.5" r="4" fill="#C4608A" opacity="0.7"/>
  <!-- Wordmark -->
  <text x="134" y="82" font-family="'Cormorant Garamond', Georgia, serif" font-size="80" font-weight="600" fill="#8B2252" letter-spacing="2">ly</text>
  <text x="240" y="82" font-family="'Cormorant Garamond', Georgia, serif" font-size="80" font-weight="400" fill="#C4608A" letter-spacing="2">va</text>
  <!-- Underline -->
