<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="2796" viewBox="0 0 1290 2796">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400&display=swap');
    </style>
  </defs>
  <!-- Background -->
  <rect width="1290" height="2796" fill="#4A1528"/>
  <!-- Subtle large bg ring decorations -->
  <circle cx="645" cy="1398" r="900" fill="none" stroke="#5C1A32" stroke-width="1"/>
  <circle cx="645" cy="1398" r="700" fill="none" stroke="#5C1A32" stroke-width="0.8"/>
  <!-- Top decorative ring echo -->
  <circle cx="645" cy="400" r="500" fill="none" stroke="#5C1A32" stroke-width="0.5" opacity="0.5"/>
  <!-- Bottom decorative ring echo -->
  <circle cx="645" cy="2400" r="500" fill="none" stroke="#5C1A32" stroke-width="0.5" opacity="0.5"/>

  <!-- Main symbol — centred -->
  <circle cx="645" cy="1280" r="260" fill="none" stroke="#72243E" stroke-width="6"/>
  <circle cx="645" cy="1280" r="202" fill="none" stroke="#8B2252" stroke-width="4"/>
  <circle cx="645" cy="1280" r="146" fill="#C4608A"/>
  <!-- Monogram -->
  <text x="645" y="1354" font-family="'Cormorant Garamond', Georgia, serif" font-size="148" font-weight="500" fill="#FBEAF0" text-anchor="middle">ly</text>
  <!-- Triple bud -->
  <circle cx="645" cy="1020" r="30" fill="#F4C0D1"/>
  <circle cx="578" cy="1042" r="21" fill="#ED93B1" opacity="0.8"/>
  <circle cx="712" cy="1042" r="21" fill="#ED93B1" opacity="0.8"/>

  <!-- Wordmark below symbol -->
  <text x="474" y="1620" font-family="'Cormorant Garamond', Georgia, serif" font-size="200" font-weight="600" fill="#FBEAF0" letter-spacing="6">ly</text>
  <text x="694" y="1620" font-family="'Cormorant Garamond', Georgia, serif" font-size="200" font-weight="400" fill="#F4C0D1" letter-spacing="6">va</text>
  <!-- Underline -->
  <line x1="474" y1="1645" x2="930" y2="1645" stroke="#ED93B1" stroke-width="3" stroke-linecap="round"/>
  <!-- Tagline -->
  <text x="645" y="1710" font-family="'DM Sans', sans-serif" font-size="48" font-weight="300" fill="#ED93B1" text-anchor="middle" letter-spacing="14">LIVE · THRIVE</text>
</svg>
