<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle (optional, remove if you want transparent) -->
  <circle cx="200" cy="200" r="190" fill="#F8F6F4" opacity="0.3"/>
  
  <!-- Main symbol: Abstract feminine form in motion -->
  <!-- Represents a woman in a gentle yoga/strength pose -->
  <path d="M 200 80 Q 160 100 160 140 Q 160 170 180 190 Q 190 200 200 200 Q 210 200 220 190 Q 240 170 240 140 Q 240 100 200 80 Z" 
        fill="#8B9E8D" 
        opacity="0.85"/>
  
  <!-- Flowing movement lines suggesting growth/progress -->
  <path d="M 200 200 Q 180 230 170 270 Q 165 290 175 310" 
        stroke="#8B9E8D" 
        stroke-width="8" 
        fill="none" 
        stroke-linecap="round"
        opacity="0.7"/>
  
  <path d="M 200 200 Q 220 230 230 270 Q 235 290 225 310" 
        stroke="#8B9E8D" 
        stroke-width="8" 
        fill="none" 
        stroke-linecap="round"
        opacity="0.7"/>
  
  <!-- Subtle cycle indicator dots - representing phases -->
  <circle cx="140" cy="200" r="6" fill="#C4A57B" opacity="0.6"/>
  <circle cx="155" cy="210" r="5" fill="#C4A57B" opacity="0.5"/>
  <circle cx="170" cy="218" r="4" fill="#C4A57B" opacity="0.4"/>
  
  <circle cx="260" cy="200" r="6" fill="#C4A57B" opacity="0.6"/>
  <circle cx="245" cy="210" r="5" fill="#C4A57B" opacity="0.5"/>
